<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یارییا مافیا بادینی - یاریزان</title>
<style>
:root{--red:#ef4444;--bg:#09070c;--card:#18131e;--border:#372942}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(circle at top,#2a0813,var(--bg) 70%);color:#fff;min-height:100vh;padding:16px;display:flex;justify-content:center}
main{width:100%;max-width:450px}
header{text-align:center;margin-bottom:20px}
header h1{color:#f87171;font-size:28px;margin-top:5px}
header p{color:#a792b8;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
h2{font-size:18px;color:#fbbf24;margin-bottom:10px}
input,select,button{width:100%;padding:12px 14px;border-radius:10px;font-size:15px;margin-top:8px}
input,select{background:#0c0a10;color:#fff;border:1px solid var(--border);outline:none}
button{background:var(--red);color:#fff;font-weight:bold;border:0;cursor:pointer}
button.sec{background:#2a2035;border:1px solid #4a385c}
.hidden{display:none!important}
.player-row{display:flex;justify-content:space-between;align-items:center;background:#231a2d;padding:10px 12px;border-radius:8px;margin-top:6px;border:1px solid #3d2d4e}
.card-flip{perspective:1000px;height:160px;margin:15px 0;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d;text-align:center}
.card-inner.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.front{background:#23121a;border:2px dashed #f87171;color:#f87171;font-size:18px}
.back{background:#1e0a12;border:2px solid #f87171;color:#fff;font-size:22px;font-weight:bold;transform:rotateY(180deg)}
.small{font-size:12px;color:#a792b8}
</style>
</head>
<body>
<main>
<header>
  <div style="font-size:40px">🎭</div>
  <h1>مافیا بادینی</h1>
  <p>پەنەلا یاریزانی</p>
</header>

<section id="sec-home" class="card">
  <h2>چوونا ژوورێ</h2>
  <input id="in-name" maxlength="15" placeholder="ناڤێ یاریێ">
  <input id="in-pin" maxlength="2" inputmode="numeric" placeholder="کۆدێ ژوورێ (٢ ژمارە)" style="margin-top:14px">
  <button id="btn-join" class="sec">داخوازییا چوونا ژوورێ</button>
  <p id="msg" style="color:#f87171;font-weight:bold;text-align:center;margin-top:8px"></p>
</section>

<section id="sec-wait" class="card hidden" style="text-align:center;padding:30px 20px;">
  <h2>⏳ لە چاوەڕوانیا سەرۆکی دەڤە...</h2>
  <p class="small" style="margin-top:10px">تکایە بوەستە تاوەکو ئەدمین ناڤێ تە پەسەند دکەت.</p>
</section>

<section id="sec-lobby" class="card hidden">
  <h2>ژوورا مافیا (چاوەڕوانیا دەستپێکرنێ)</h2>
  <div id="list-players"></div>
</section>

<section id="sec-game" class="card hidden">
  <h2 id="phase-title">شەڤا تاریک 🌙</h2>
  <div class="card-flip" onclick="flipCard()">
    <div id="card-inner" class="card-inner">
      <div class="front">🎴 کارتێ خۆ ڤەکە <span class="small" style="margin-top:5px">(کلیک بکە)</span></div>
      <div id="card-role-back" class="back">ڕۆلێ تە</div>
    </div>
  </div>

  <div id="mafia-team" class="card hidden" style="background:#260a12;border-color:#f87171;padding:10px">
    <strong style="color:#f87171;font-size:13px">👥 تیمی مافیا:</strong>
    <p id="mafia-names" class="small" style="color:#fff;margin-top:4px">-</p>
  </div>

  <div id="night-box" class="card hidden" style="background:#130d1d;border-color:#a855f7;padding:12px">
    <strong style="color:#c084fc;font-size:14px" id="night-title">🌙 چالاکیا ڕۆلێ تە</strong>
    <select id="night-select"></select>
    <button id="btn-night-act" style="background:#8b5cf6;margin-top:8px">تۆمارکرنا بڕیارێ 🔒</button>
    <p id="night-res" class="small" style="color:#4ade80;margin-top:6px;font-weight:bold"></p>
  </div>

  <div id="day-box" class="hidden" style="margin-top:14px">
    <h3 style="color:#fbbf24;font-size:16px">🗳️ دەنگدانا ڕۆژێ</h3>
    <div id="judge-public" class="card hidden" style="background:#1c170d;border-color:#eab308;padding:10px;text-align:center">
      <strong style="color:#eab308;font-size:14px">⚖️ بڕیارا دادوەری:</strong>
      <p id="judge-text" class="small" style="margin-top:4px">-</p>
    </div>
    <div id="vote-list" style="margin-top:8px"></div>
  </div>

  <button id="btn-exit" class="sec" style="margin-top:14px">دەرکەفتن ژ ژوورێ</button>
</section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

  const db = getDatabase(initializeApp({
    apiKey: "AIzaSyApi9n_0mZM1-ErqnBZTkDignhe0jBo4ys",
    authDomain: "mafia-badine.firebaseapp.com",
    databaseURL: "https://mafia-badine-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mafia-badine"
  }));

  let room = null, me = { id: 'u_' + Math.random().toString(36).substr(2,5), name: '', role: '', type: '' }, flipped = false;
  let audioCtx = null;

  function playClick() {
    try {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
  }

  function playRoleMusic(role) {
    try {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      
      if(role.includes("مافیا")) { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); }
      else if(role.includes("نوژدار")) { osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); }
      else if(role.includes("پولیس") || role.includes("ڤەکولەر")) { osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); }
      else { osc.type = 'sine'; osc.frequency.setValueAtTime(220, audioCtx.currentTime); }

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.6);
    } catch(e){}
  }

  function showSec(id) {
    playClick();
    ["sec-home","sec-wait","sec-lobby","sec-game"].forEach(x => document.getElementById(x).classList.toggle("hidden", x !== id));
  }

  document.getElementById("btn-join").onclick = () => {
    let name = document.getElementById("in-name").value.trim();
    let pin = document.getElementById("in-pin").value.trim();
    if(!name || pin.length !== 2) { alert("ناڤ و کۆدێ ۲ ژمارەیی بنڤیسە!"); return; }
    
    room = pin;
    get(ref(db, 'rooms/' + room)).then(snap => {
      if(snap.exists()) {
        let players = snap.val().players || {};
        let existingId = Object.keys(players).find(k => players[k].name === name);
        if(existingId) { me.id = existingId; }
        me.name = name;
        
        set(ref(db, `rooms/${room}/players/${me.id}`), { 
          name: me.name, role: players[me.id]?.role || '', type: players[me.id]?.type || '', approved: players[me.id]?.approved || false 
        }).then(() => {
          showSec("sec-wait");
          listenRoom();
        });
      } else { alert("ژوور نەهاتە دیتن!"); }
    });
  };

  function listenRoom() {
    onValue(ref(db, 'rooms/' + room), snap => {
      let data = snap.val();
      if(!data) { alert("ژوور هاتە داخستن!"); location.reload(); return; }
      let players = data.players || {};
      if(!players[me.id]) { alert("تۆ هاتە دەرئێخستن!"); location.reload(); return; }

      if(!players[me.id].approved) { showSec("sec-wait"); return; }

      let pKeys = Object.keys(players);
      document.getElementById("list-players").innerHTML = pKeys.filter(k=>players[k].approved).map(k=>`<div class="player-row">👤 ${players[k].name}</div>`).join("");

      if(data.status === 'lobby') showSec("sec-lobby");
      else if(data.status === 'playing') {
        showSec("sec-game");
        let newRole = players[me.id].role;
        if(me.role !== newRole && newRole) {
          me.role = newRole;
          playRoleMusic(newRole);
        }
        me.type = players[me.id].type;
        document.getElementById("card-role-back").textContent = me.role;

        if(me.type === 'مافیا') {
          document.getElementById("mafia-team").classList.remove("hidden");
          document.getElementById("mafia-names").textContent = Object.values(players).filter(p=>p.type==='مافیا' && p.approved).map(p=>p.name).join(", ");
        }

        let nBox = document.getElementById("night-box");
        if(["سەرۆکێ مافیا","مافیێ سادە","مافیێ فێلباز","نوژدارێ هاولاتیا","نوژدارێ مافیا","پولیس","شاە کوژ","ڤەکولەر"].includes(me.role)) {
          nBox.classList.remove("hidden");
          document.getElementById("night-select").innerHTML = pKeys.filter(k=>k!==me.id && k!==data.host && players[k].approved).map(k=>`<option value="${k}">${players[k].name}</option>`).join("");
        } else nBox.classList.add("hidden");

        let isDay = (data.phase === "ڕۆژ");
        document.getElementById("phase-title").textContent = isDay ? "☀️ ڕۆژ (دەنگدان)" : "🌙 شەڤا تاریک";
        document.getElementById("day-box").classList.toggle("hidden", !isDay);

        if(data.judgeDecision) {
          document.getElementById("judge-public").classList.remove("hidden");
          document.getElementById("judge-text").textContent = data.judgeDecision;
        } else {
          document.getElementById("judge-public").classList.add("hidden");
        }

        if(isDay) {
          document.getElementById("vote-list").innerHTML = pKeys.filter(k=>k!==me.id && k!==data.host && players[k].approved).map(k=>`<div class="player-row"><span>${players[k].name}</span> <button style="width:auto;padding:5px 10px" onclick="voteP('${players[k].name}')">دەنگدان</button></div>`).join("");
        }
      }
    });
  }

  window.flipCard = () => { playClick(); flipped = !flipped; document.getElementById("card-inner").classList.toggle("flipped", flipped); };
  window.voteP = (tName) => { playClick(); set(ref(db, `rooms/${room}/votes/${me.id}`), { voter: me.name, target: tName }).then(()=>alert("دەنگ هاتە تۆمارکرن!")); };

  document.getElementById("btn-night-act").onclick = () => {
    playClick();
    let tId = document.getElementById("night-select").value;
    get(ref(db, `rooms/${room}/players/${tId}`)).then(snap => {
      let tP = snap.val();
      set(ref(db, `rooms/${room}/nightActions/${me.id}`), { actor: me.name, role: me.role, target: tP.name }).then(()=>{
        let res = document.getElementById("night-res");
        if(me.role === 'ڤەکولەر') res.textContent = `🔍 ڕۆلێ (${tP.name}): [ ${tP.role} ]`;
        else res.textContent = `✅ بڕیار بۆ ئەدمینی هاتیە هناردن!`;
      });
    });
  };

  document.getElementById("btn-exit").onclick = () => { playClick(); remove(ref(db, `rooms/${room}/players/${me.id}`)); location.reload(); };
</script>
</body>
</html>
