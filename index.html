<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یارییا مافیا بادینی</title>
<style>
:root{--red:#e63950;--bg:#0b090d;--panel:#19131a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#35111d,var(--bg) 65%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:18px}
main{max-width:480px;margin:auto}
header{text-align:center;padding:24px 0}
.logo{font-size:48px}
h1{color:#ff526b;margin:10px 0}
p{color:#c9bbc4;line-height:1.7}
.card{background:#19131a;border:1px solid #48212d;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0005}
h2{font-size:19px}
input,button,select{width:100%;padding:14px;border-radius:10px;margin:6px 0;font-size:16px}
input,select{background:#0c0a0e;color:white;border:1px solid #59313d}
button{border:0;background:var(--red);color:white;font-weight:bold;cursor:pointer;transition:transform 0.1s}
button:active{transform:scale(0.97)}
button.secondary{background:#34232c;border:1px solid #69404b}
button.police-btn{background:#1d4ed8;border:1px solid #3b82f6}
button:disabled{opacity:.5}
.hidden{display:none!important}
.pin{font-size:30px;letter-spacing:5px;color:#ff6579;text-align:center;font-weight:bold}
.player{padding:10px;background:#241922;border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;}
.role{font-size:26px;color:#ff6579;text-align:center;padding:22px 8px;border:1px dashed #ff526b;border-radius:12px;margin:10px 0;}
.small{font-size:13px;color:#a99aa4}
#message{color:#ff526b;font-weight:bold;text-align:center;margin-top:10px;}
.audio-panel{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-top:15px;text-align:center;}
</style>
</head>
<body>
<main>
<header>
<div class="logo">🎭</div>
<h1>یارییا مافیا</h1>
<p>ژوورێ تایبەت • ڕۆلێن نهێنی • سیستەمێ دەنگی</p>
</header>

<section id="home" class="card">
<h2>ب خێرهاتی</h2>
<input id="name" maxlength="20" placeholder="ناڤێ تە">
<button onclick="playBtnSound(); createRoom();">دروستکرنا ژوورەکێ نوو</button>
<hr style="border-color:#48212d">
<input id="pinInput" maxlength="6" inputmode="numeric" placeholder="کۆدێ ژوورێ PIN">
<button class="secondary" onclick="playBtnSound(); joinRoom();">چوونا ژوورێ</button>
<p id="message"></p>
</section>

<section id="lobby" class="card hidden">
<h2>ژوورا مافیا</h2>
<p>کۆدێ ژوورێ:</p>
<div class="pin" id="pinDisplay"></div>
<button class="secondary" onclick="playBtnSound(); copyPin();">کۆپی کرنا کۆدێ ژوورێ</button>
<p id="count">٠ یاریزان</p>
<div id="players"></div>
<div id="hostControls" class="hidden">
<button onclick="playBtnSound(); startGame();">دەستپێکرنا یاریێ</button>
</div>
<p class="small">سەرۆک دێ یاریێ دەست پێ کەت.</p>
</section>

<section id="game" class="card hidden">
<h2 id="phaseTitle">ڕۆلێ تە</h2>
<p id="phaseInfo">کارتێ خۆ ڤەکە و ڕۆلێ خۆ ببینە.</p>
<div id="roleCard" class="role">🔒 ڕۆلێ خۆ ببینە</div>
<button id="reveal" onclick="playBtnSound(); revealRole();">نیشاندانا ڕۆلێ من</button>

<div id="policeControls" class="hidden" style="margin-top:15px; border-top:1px solid #444; padding-top:10px;">
<h3 style="color:#60a5fa; margin:5px 0;">🚔 دەسەڵاتێن پۆلیسی</h3>
<button class="police-btn" onclick="playBtnSound(); toggleMuteAll(true);">بێدەنگکرنا یاریزانان 🔇</button>
<button class="police-btn" style="background:#2563eb;" onclick="playBtnSound(); toggleMuteAll(false);">ڤەکرنا ئاخفتنێ 🎙️</button>
</div>

<button id="nextPhaseBtn" class="secondary hidden" onclick="playBtnSound(); nextPhase();">گۆڕینا شەڤ / ڕۆژ</button>
<button class="secondary" onclick="playBtnSound(); location.reload();">دەرکەفتن</button>

<div class="audio-panel">
<h3>🎙️ بێسیم و ئاخفتن</h3>
<button id="micBtn" class="secondary" onclick="toggleMic()">چالاککرنا مایکێ 🎤</button>
<p id="micStatus" class="small">مایک ئامادەیە</p>
</div>
</section>
</main>

<script>
const roles = [
    ["مافیێ سادە","مافیا"], ["مافیێ فێلباز","مافیا"], ["سەرۆکێ مافیا","مافیا"], 
    ["شاە کوژ","مافیا"], ["نوژدارێ مافیا","مافیا"], ["گروپێ هاولاتی","هاولاتی"], 
    ["دادوەر","هاولاتی"], ["پولیس","هاولاتی"], ["باژێرڤان","هاولاتی"], 
    ["مێرخاص","هاولاتی"], ["هاولاتیێ سادە","هاولاتی"], ["گورکول","هاولاتی"], 
    ["ڤەکولەر","هاولاتی"], ["هاولاتیێ بێ دەنک","هاولاتی"], ["هاولاتیێ بومبە","هاولاتی"], 
    ["کشاف","هاولاتی"], ["نوژدارێ هاولاتیا","هاولاتی"]
];

let room = null;
let me = { id: 'usr_' + Math.random().toString(36).substr(2, 7), name: '', role: null };
let isHost = false;
let revealed = false;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

window.playBtnSound = function() {
    try {
        initAudio();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
};

function playRoleSound(roleType) {
    try {
        initAudio();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        if (roleType.includes("مافیا")) {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.type = 'sawtooth';
        } else {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.type = 'square';
        }
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } catch(e){}
}

function show(id) {
    ["home", "lobby", "game"].forEach(x =>
        document.getElementById(x).classList.toggle("hidden", x !== id)
    );
}

function msg(t) { document.getElementById("message").textContent = t; }

function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

window.createRoom = function() {
    const name = document.getElementById("name").value.trim();
    if (!name) { msg("سەرەتا ناڤێ خۆ بنڤیسە."); return; }
    
    me.name = name;
    room = String(Math.floor(100000 + Math.random() * 900000));
    isHost = true;

    let roomData = {
        host: me.id,
        status: 'lobby',
        phase: 'شەڤ',
        globalMute: false,
        players: { [me.id]: { name: me.name, role: '' } }
    };

    localStorage.setItem('mafia_room_' + room, JSON.stringify(roomData));
    openLobby();
};

window.joinRoom = function() {
    const name = document.getElementById("name").value.trim();
    const pin = document.getElementById("pinInput").value.trim();
    if (!name || pin.length !== 6) { msg("ناڤ و کۆدێ ٦ ژمارەیی بنڤیسە."); return; }

    let raw = localStorage.getItem('mafia_room_' + pin);
    if (!raw) { msg("کۆدێ ژوورێ نە هاتە دیتن."); return; }

    let roomData = JSON.parse(raw);
    me.name = name;
    room = pin;

    roomData.players[me.id] = { name: me.name, role: '' };
    localStorage.setItem('mafia_room_' + room, JSON.stringify(roomData));
    openLobby();
};

function openLobby() {
    document.getElementById("pinDisplay").textContent = room;
    show("lobby");
    
    setInterval(updateLobbyData, 1000);
}

function updateLobbyData() {
    if (!room) return;
    let raw = localStorage.getItem('mafia_room_' + room);
    if (!raw) return;
    let data = JSON.parse(raw);

    const players = data.players || {};
    const playerList = Object.keys(players);

    document.getElementById("count").textContent = `${playerList.length} یاریزان`;
    let html = '';
    playerList.forEach(id => {
        let isRoomHost = (id === data.host);
        html += `<div class="player"><span>${escapeHtml(players[id].name)}</span> ${isRoomHost ? '<small style="color:#ff6579">(سەرۆک)</small>' : ''}</div>`;
    });
    document.getElementById("players").innerHTML = html;

    if (isHost) {
        document.getElementById("hostControls").classList.remove("hidden");
        document.getElementById("nextPhaseBtn").classList.remove("hidden");
    }

    if (data.status === 'playing') {
        show("game");
        if (players[me.id]) {
            me.role = players[me.id].role;
            if (me.role === "پولیس" || isHost) {
                document.getElementById("policeControls").classList.remove("hidden");
            }
        }
        document.getElementById("phaseTitle").textContent = data.phase || "شەڤ";
        document.getElementById("phaseInfo").textContent = 
            data.phase === "شەڤ" ? "شەڤ هات؛ ڕۆلێن شەڤێ دەست پێ دکەن." : "ڕۆژ هات؛ گەنگەشە دەست پێ دکەت.";
    }
}

window.copyPin = function() {
    if (navigator.clipboard) navigator.clipboard.writeText(room);
    alert("کۆدێ ژوورێ: " + room);
};

window.startGame = function() {
    let raw = localStorage.getItem('mafia_room_' + room);
    if (!raw) return;
    let data = JSON.parse(raw);
    const players = data.players;
    const playerIds = Object.keys(players);

    let deck = shuffle([...roles]);
    data.status = 'playing';
    data.phase = 'شەڤ';

    playerIds.forEach((id, index) => {
        players[id].role = deck[index % deck.length][0];
    });

    localStorage.setItem('mafia_room_' + room, JSON.stringify(data));
};

window.revealRole = function() {
    if (!me.role) return;
    revealed = !revealed;
    document.getElementById("roleCard").textContent = revealed ? me.role : "🔒 ڕۆلێ خۆ ببینە";
    document.getElementById("reveal").textContent = revealed ? "شارِتنا ڕۆلێ خۆ" : "نیشاندانا ڕۆلێ من";
    if (revealed) playRoleSound(me.role);
};

window.toggleMuteAll = function(status) {
    let raw = localStorage.getItem('mafia_room_' + room);
    if (!raw) return;
    let data = JSON.parse(raw);
    data.globalMute = status;
    localStorage.setItem('mafia_room_' + room, JSON.stringify(data));
};

window.nextPhase = function() {
    let raw = localStorage.getItem('mafia_room_' + room);
    if (!raw) return;
    let data = JSON.parse(raw);
    data.phase = data.phase === "شەڤ" ? "ڕۆژ" : "شەڤ";
    localStorage.setItem('mafia_room_' + room, JSON.stringify(data));
};

window.toggleMic = function() {
    alert("مایک ب سەرکەفتن هاتە چالاککرن!");
};

function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
